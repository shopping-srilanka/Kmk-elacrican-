  /* ---------------- helpers ---------------- */
  const clone = o => JSON.parse(JSON.stringify(o));
  function merge(base, over) {
    if (over === undefined || over === null) return base;
    if (Array.isArray(base)) return Array.isArray(over) ? over : base;
    if (base && typeof base === "object") {
      const o = {};
      for (const k in base) o[k] = merge(base[k], over[k]);
      for (const k in over) if (!(k in o)) o[k] = over[k];
      return o;

    },
    themeStyle(t, u, uc) { return Object.entries(api.themeVars(t, u, uc)).map(([k, v]) => k + ":" + v).join(";"); },

<style>
  :root{
    --bg:#07090e; --bg2:#121621; --text:#f2f5f9; --muted:#8e99ab;
    --cyan:#0a84ff; --amber:#ffb84d; --green:#30d158; --red:#ff453a;
    --glass:rgba(255,255,255,.06); --glass-solid:rgba(18,22,33,.92);
    --glass-border:rgba(255,255,255,.11); --glass-hi:rgba(255,255,255,.08);

    --glow:rgba(10,132,255,.14); --glow2:rgba(255,184,77,.11);
    --line:rgba(255,255,255,.08);
    --radius:20px; --blur:24px; --pad:18px;

    --spring:cubic-bezier(0.22, 1, 0.36, 1);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html{font-size:100%; scroll-behavior:smooth;}
  body{
    background:
      radial-gradient(circle at 12% 4%, var(--glow) 0%, transparent 42%),
      radial-gradient(circle at 88% 14%, var(--glow2) 0%, transparent 40%),
      radial-gradient(circle at 50% 92%, var(--glow) 0%, transparent 50%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text); font-family:var(--fb); line-height:1.5; min-height:100vh;
    padding-bottom:calc(112px + env(safe-area-inset-bottom)); overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand,.ordn{font-family:var(--fh); letter-spacing:-0.02em;}
  a{color:inherit; text-decoration:none;}
  ::-webkit-scrollbar{width:5px; height:5px;}
  ::-webkit-scrollbar-thumb{background:linear-gradient(var(--cyan),var(--amber)); border-radius:99px;}
  body.noanim *{animation:none!important; transition:none!important;}

  @keyframes riseIn{from{opacity:0; transform:translateY(14px) scale(.985);}to{opacity:1; transform:none;}}
  @keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(48,209,88,.6);}50%{box-shadow:0 0 0 7px rgba(48,209,88,0);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes floatSlow{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  @keyframes shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}

  /* ---------------- Translucent Header ---------------- */
  header{
    position:sticky; top:0; z-index:50;
    padding:11px 16px; padding-top:calc(11px + env(safe-area-inset-top));
    background:var(--head-bg);
    backdrop-filter:blur(var(--blur)) saturate(190%);
    -webkit-backdrop-filter:blur(var(--blur)) saturate(190%);
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    transition:box-shadow .28s var(--spring), background .28s;
  }
  header.scrolled{box-shadow:0 10px 30px rgba(0,0,0,.22);}
  .brand{
    font-weight:800; font-size:.92rem; letter-spacing:.2px;

    transition:transform .18s var(--spring);

  .menu-toggle:active{transform:scale(.9);}

    transform:translateX(110%); transition:transform .34s var(--spring);
    overflow-y:auto; box-shadow:0 24px 60px rgba(0,0,0,.45);

  .nav-drawer.open{transform:none;}
  .drawer-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:4px 8px 12px; border-bottom:1px solid var(--line); margin-bottom:4px;

    transition:transform .16s var(--spring), background .2s;

  .nav-drawer button:active{transform:scale(.97);}
  .nav-drawer button.active{
    background:linear-gradient(135deg, var(--cyan), color-mix(in srgb, var(--cyan) 75%, #0051ff));
    color:#fff; border-color:transparent; box-shadow:0 6px 20px color-mix(in srgb, var(--cyan) 35%, transparent);
  }

  /* ---------------- Main Container & Cards ---------------- */
  main{max-width:860px; margin:0 auto; padding:16px 15px; animation:riseIn .36s var(--spring);}
  .page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .page-title{
    font-size:1.65rem; font-weight:800; letter-spacing:-.03em; line-height:1.15;
    display:flex; align-items:center; gap:8px;
  }
  .page-sub{color:var(--muted); font-size:.84rem; margin-top:3px;}

  .card{
    background:var(--glass);
    border:1px solid var(--glass-border);
    box-shadow:0 8px 28px rgba(0,0,0,.14), inset 0 1px 0 var(--glass-hi);
    border-radius:var(--radius);
    padding:var(--pad);
    backdrop-filter:blur(var(--blur)) saturate(180%);
    -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
    margin-bottom:14px;
    transition:transform .22s var(--spring), border-color .22s, box-shadow .22s;
  }
  .card h3{font-size:.96rem; font-weight:700; margin-bottom:5px; letter-spacing:-.01em;}
  .card p{color:var(--muted); font-size:.85rem; line-height:1.5;}
  .grid{display:grid; gap:13px; grid-template-columns:repeat(auto-fit,minmax(255px,1fr));}
  .grid .card{margin:0; display:flex; flex-direction:column; justify-content:space-between;}
  .grid .card:hover{border-color:color-mix(in srgb,var(--cyan) 50%,transparent); transform:translateY(-2px);}

  .tag-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px;}
  .tag{
    font-size:.72rem; font-weight:600; padding:4px 10px; border-radius:999px;
    background:color-mix(in srgb,var(--cyan) 12%,transparent);
    color:var(--cyan); border:1px solid color-mix(in srgb,var(--cyan) 26%,transparent);
  }

  /* ---------------- Buttons ---------------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 20px; min-height:48px;
    border-radius:calc(var(--radius) * .8); border:0; cursor:pointer;
    font-family:var(--fb); font-weight:700; font-size:.86rem; letter-spacing:.2px;
    transition:transform .18s var(--spring), box-shadow .2s, opacity .2s; width:100%;
  }
  .btn:active{transform:scale(.96);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn-main{
    background:linear-gradient(135deg, var(--amber), color-mix(in srgb, var(--amber) 72%, #ff5e00));

  }

    border:1px solid var(--glass-border);
    backdrop-filter:blur(12px);
  }
  .btn-ghost:hover{border-color:var(--cyan); color:var(--cyan);}
  .btn-sm{width:auto; min-height:38px; padding:8px 15px; font-size:.78rem; border-radius:999px;}
  .btn-red{background:rgba(255,69,58,.12); color:var(--red); border:1px solid rgba(255,69,58,.3);}
  .btn-row{display:flex; gap:9px; flex-wrap:wrap;} .btn-row .btn{flex:1; min-width:110px;}

  /* ---------------- Home Hero & Widgets ---------------- */
  .hero{
    position:relative; padding:26px 20px;
    border-radius:calc(var(--radius) * 1.3); overflow:hidden;
    border:1px solid var(--glass-border);
    background:
      radial-gradient(circle at 88% 16%, color-mix(in srgb,var(--amber) 24%,transparent), transparent 52%),
      radial-gradient(circle at 12% 88%, color-mix(in srgb,var(--cyan) 22%,transparent), transparent 55%),
      linear-gradient(145deg, color-mix(in srgb,var(--bg2) 82%,transparent), var(--glass));
    box-shadow:0 18px 42px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.14);
    margin-bottom:14px;
  }
  .hero .bolt{position:absolute; right:-18px; top:-14px; width:156px; height:156px; opacity:.95; pointer-events:none;}
  .hero .bolt .ring{position:absolute; inset:0; border-radius:50%; border:1.5px dashed color-mix(in srgb,var(--cyan) 40%,transparent); animation:spin 28s linear infinite;}
  .hero .bolt .ring.b{inset:17%; border-color:color-mix(in srgb,var(--amber) 55%,transparent); animation-direction:reverse; animation-duration:18s;}
  .hero .bolt .core{
    position:absolute; inset:0; display:grid; place-items:center;
    font-size:3.1rem; color:var(--amber); filter:drop-shadow(0 0 16px var(--amber));
    animation:floatSlow 3.6s ease-in-out infinite;
  }
  .hero .bolt .core svg{width:1em; height:1em; fill:currentColor;}
  .hero .bolt .core img{
    width:64%; height:64%; border-radius:24px; object-fit:cover;
    box-shadow:0 0 0 2px var(--amber), 0 10px 26px rgba(0,0,0,.45);
  }
  .badge{
    display:inline-flex; align-items:center; gap:7px;
    font-size:.73rem; font-weight:700; color:var(--green);
    border:1px solid rgba(48,209,88,.35); background:rgba(48,209,88,.11);
    padding:5px 13px; border-radius:999px; margin-bottom:14px; position:relative;
    backdrop-filter:blur(10px);
  }
  .badge i{width:7px; height:7px; border-radius:50%; background:var(--green); animation:pulseDot 1.8s infinite;}
  .hero h1{font-size:1.88rem; font-weight:900; line-height:1.12; margin-bottom:10px; position:relative; max-width:74%; letter-spacing:-.03em;}
  .hero h1 em{
    font-style:normal;
    background:linear-gradient(135deg, var(--amber), #ff7b00);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero p{color:var(--muted); font-size:.87rem; margin-bottom:18px; position:relative; max-width:85%; line-height:1.55;}
  .hero.nobolt h1,.hero.nobolt p{max-width:100%;}
  .hero-btns{display:flex; gap:10px; flex-wrap:wrap; position:relative;}
  .hero-btns .btn-main{flex:2; min-width:190px;}
  .hero-btns .btn-ghost{flex:1; min-width:130px;}

  /* Quick Action Pills */
  .quick{display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin-bottom:16px;}
  @media (max-width:460px){.quick{grid-template-columns:repeat(2,1fr);}}
  .quick-item{
    display:flex; align-items:center; gap:9px; padding:12px 13px;
    border-radius:calc(var(--radius) * .85);
    border:1px solid var(--glass-border); background:var(--glass);
    backdrop-filter:blur(var(--blur)); -webkit-backdrop-filter:blur(var(--blur));

  }
  .quick-item:active{transform:scale(.95);}

  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(105px,1fr)); gap:10px; margin-bottom:16px;}

    padding:4px 10px; border-radius:999px;
  }
  .avail i{width:7px; height:7px; border-radius:50%; background:currentColor;}
  .avail.on{color:var(--green); background:rgba(48,209,88,.12);}
  .avail.busy{color:var(--amber); background:rgba(255,184,77,.12);}
  .meta{
    display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0;
    padding:10px; border-radius:13px; background:color-mix(in srgb,var(--bg) 45%,transparent);
    border:1px solid var(--line); font-size:.78rem; color:var(--muted); text-align:center;
  }
  .meta b{color:var(--text); font-size:.95rem; display:block;}

  /* ==========================================================
     FULL UPGRADED BOOKING PAGE STYLES
     ========================================================== */
  .book-steps{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
    margin-bottom:14px; padding:6px; border-radius:16px;
    background:var(--glass); border:1px solid var(--glass-border);
  }
  .book-step{
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:9px 8px; border-radius:12px; font-size:.75rem; font-weight:700;
    color:var(--muted); transition:.22s var(--spring);
  }
  .book-step.active{
    background:color-mix(in srgb,var(--cyan) 16%,transparent);
    color:var(--cyan); border:1px solid color-mix(in srgb,var(--cyan) 32%,transparent);
  }
  .book-step.done{color:var(--green);}

  /* Urgency Segmented Control */
  .ios-seg{
    display:grid; grid-template-columns:repeat(3,1fr); gap:6px;
    padding:5px; border-radius:15px; background:color-mix(in srgb,var(--bg) 55%,var(--glass));
    border:1px solid var(--line); margin-bottom:6px;
  }
  .ios-seg button{
    border:0; background:transparent; color:var(--muted);
    padding:10px 6px; border-radius:11px; font:700 .76rem var(--fb);
    cursor:pointer; transition:.2s var(--spring); display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .ios-seg button small{font-size:.63rem; font-weight:500; opacity:.8;}
  .ios-seg button.on{
    background:var(--glass-solid); color:var(--text);
    box-shadow:0 4px 14px rgba(0,0,0,.22), inset 0 1px 0 var(--glass-hi);
    border:1px solid var(--glass-border);
  }
  .ios-seg button.on[data-urg="Emergency 24/7"]{color:var(--red); border-color:rgba(255,69,58,.4);}
  .ios-seg button.on[data-urg="Express Today"]{color:var(--amber); border-color:rgba(255,184,77,.4);}

  /* Visual Service Picker Grid in Book Page */
  .svc-pick-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(145px,1fr)); gap:9px;
    margin-bottom:6px;
  }
  .svc-pick-card{
    position:relative; text-align:left; padding:12px;
    border-radius:16px; border:1.5px solid var(--line);
    background:color-mix(in srgb,var(--bg) 35%,var(--glass));
    color:var(--text); cursor:pointer; transition:.2s var(--spring);
    display:flex; flex-direction:column; gap:5px;
  }
  .svc-pick-card:active{transform:scale(.96);}
  .svc-pick-card .sp-top{display:flex; justify-content:space-between; align-items:center;}
  .svc-pick-card .sp-emo{font-size:1.4rem;}
  .svc-pick-card .sp-chk{
    width:20px; height:20px; border-radius:50%; border:1.5px solid var(--muted);
    display:grid; place-items:center; font-size:.68rem; color:transparent; transition:.18s;
  }
  .svc-pick-card b{font-size:.8rem; line-height:1.25; display:block;}
  .svc-pick-card small{font-size:.68rem; color:var(--amber); font-weight:600;}
  .svc-pick-card.on{
    border-color:var(--cyan);
    background:color-mix(in srgb,var(--cyan) 14%,var(--glass));
    box-shadow:0 6px 18px color-mix(in srgb,var(--cyan) 18%,transparent);
  }
  .svc-pick-card.on .sp-chk{background:var(--cyan); border-color:var(--cyan); color:#fff;}

  /* Visual Electrician Picker Strip */
  .elec-pick-row{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none;
  }
  .elec-pick-row::-webkit-scrollbar{display:none;}
  .elec-pill{
    flex:none; display:flex; align-items:center; gap:9px;
    padding:9px 13px; border-radius:14px; border:1.5px solid var(--line);
    background:color-mix(in srgb,var(--bg) 35%,var(--glass));
    color:var(--text); cursor:pointer; font:600 .78rem var(--fb); transition:.18s var(--spring);
  }
  .elec-pill .ep-av{
    width:30px; height:30px; border-radius:10px; display:grid; place-items:center;
    background:linear-gradient(135deg,var(--cyan),var(--amber)); color:#111; font-weight:800; font-size:.82rem;
  }
  .elec-pill small{display:block; font-size:.66rem; color:var(--muted); font-weight:500;}
  .elec-pill.on{
    border-color:var(--cyan);
    background:color-mix(in srgb,var(--cyan) 14%,var(--glass));
  }

  /* 7-Day Calendar Strip (#dayChips) */
  .cal-strip{
    display:flex; gap:8px; overflow-x:auto; padding:4px 2px 8px; scrollbar-width:none;
  }
  .cal-strip::-webkit-scrollbar{display:none;}
  .cal-day{
    flex:none; min-width:68px; padding:10px 8px; border-radius:16px;
    border:1.5px solid var(--line);
    background:color-mix(in srgb,var(--bg) 35%,var(--glass));
    color:var(--text); cursor:pointer; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    transition:.18s var(--spring);
  }
  .cal-day:active{transform:scale(.94);}
  .cal-day small{font-size:.64rem; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.4px;}
  .cal-day b{font-size:1.1rem; font-family:var(--fh); font-weight:800; line-height:1.15;}
  .cal-day u{text-decoration:none; font-size:.63rem; color:var(--muted);}
  .cal-day.on{
    background:linear-gradient(145deg, var(--cyan), color-mix(in srgb,var(--cyan) 72%,#0051ff));
    color:#fff; border-color:transparent;
    box-shadow:0 6px 18px color-mix(in srgb,var(--cyan) 34%,transparent);
  }
  .cal-day.on small,.cal-day.on u{color:rgba(255,255,255,.85);}

  /* Time Chips (#timeChips) */
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:2px;}
  .chips button{
    border:1.5px solid var(--line);
    background:color-mix(in srgb,var(--bg) 35%,var(--glass));
    color:var(--text); padding:10px 14px; border-radius:13px;
    font:700 .78rem var(--fb); cursor:pointer; transition:.16s var(--spring);
    display:inline-flex; align-items:center; gap:5px;
  }
  .chips button:active{transform:scale(.95);}
  .chips button.on{
    background:linear-gradient(135deg, var(--amber), color-mix(in srgb,var(--amber) 75%,#ff6a00));
    color:#140d00; border-color:transparent;
    box-shadow:0 5px 15px color-mix(in srgb,var(--amber) 32%,transparent);
  }
  .chips button:disabled{opacity:.28; text-decoration:line-through; cursor:not-allowed;}

  /* Quick Problem Tags & Area Chips */
  .quick-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .qtag{
    border:1px solid var(--glass-border); background:var(--glass);
    color:var(--muted); padding:6px 11px; border-radius:999px;
    font:600 .72rem var(--fb); cursor:pointer; transition:.16s;
  }
  .qtag:hover,.qtag.on{border-color:var(--amber); color:var(--amber); background:color-mix(in srgb,var(--amber) 12%,transparent);}

  /* Form Inputs */
  label{
    display:flex; align-items:center; justify-content:space-between;
    font-size:.72rem; font-weight:700; color:var(--muted);
    margin:15px 0 7px; letter-spacing:.6px; text-transform:uppercase;
  }
  label:first-child{margin-top:0;}
  input,select,textarea{
    width:100%; background:color-mix(in srgb,var(--bg) 42%,var(--glass));
    border:1.5px solid var(--line); border-radius:calc(var(--radius) * .72);
    padding:12px 14px; min-height:48px; color:var(--text);
    font:500 .92rem var(--fb); outline:none;
    transition:border-color .2s, box-shadow .2s, background .2s;
  }
  select option{background:var(--bg2); color:var(--text);}
  input:focus,select:focus,textarea:focus{
    border-color:var(--cyan);
    box-shadow:0 0 0 3.5px color-mix(in srgb,var(--cyan) 20%,transparent);
  }
  textarea{resize:vertical; min-height:84px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media (max-width:480px){.row2{grid-template-columns:1fr;}}
  .err{color:var(--red); font-size:.8rem; font-weight:600; min-height:20px; margin:10px 0 4px;}
  .invalid{border-color:var(--red)!important; box-shadow:0 0 0 3px rgba(255,69,58,.2)!important; animation:shake .3s;}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

  /* Live Booking Summary Bar */
  .book-summary{
    margin:14px 0 12px; padding:13px 15px; border-radius:16px;
    background:linear-gradient(135deg, color-mix(in srgb,var(--cyan) 12%,transparent), color-mix(in srgb,var(--amber) 10%,transparent));
    border:1px solid var(--glass-border);
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .book-summary .bs-left small{font-size:.68rem; color:var(--muted); text-transform:uppercase; font-weight:700; letter-spacing:.5px; display:block;}
  .book-summary .bs-left b{font-size:.9rem; color:var(--text); display:block;}
  .book-summary .bs-right{font-size:.76rem; font-weight:700; color:var(--amber); background:color-mix(in srgb,var(--amber) 14%,transparent); padding:5px 11px; border-radius:999px;}

  /* Apple Wallet Style Pass Ticket */
  .ticket{
    position:relative; border-radius:24px; padding:20px;
    background:linear-gradient(145deg, color-mix(in srgb,var(--amber) 16%,var(--bg2)), var(--bg2));
    border:1.5px solid color-mix(in srgb,var(--amber) 48%,transparent);
    box-shadow:0 16px 40px rgba(0,0,0,.35);
    animation:riseIn .4s var(--spring); margin-bottom:18px; overflow:hidden;
  }
  .ticket-head{display:flex; justify-content:space-between; align-items:center; padding-bottom:12px; border-bottom:1px dashed var(--glass-border); margin-bottom:12px;}
  .ticket .ordn{font-size:1.35rem; font-weight:900; color:var(--amber); letter-spacing:1px;}
  .ticket-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; font-size:.82rem;}
  .ticket-grid small{color:var(--muted); font-size:.68rem; display:block; text-transform:uppercase;}
  .ticket-grid b{color:var(--text); font-size:.86rem;}

  /* ---------------- Bookings & Reviews ---------------- */
  .bk{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
  .bk small{color:var(--muted); font-size:.78rem; display:block; margin-top:2px;}
  .st{font-size:.68rem; font-weight:800; padding:4px 11px; border-radius:999px; letter-spacing:.5px; white-space:nowrap;}
  .st.pending{color:var(--amber); background:color-mix(in srgb,var(--amber) 16%,transparent); border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);}
  .st.confirmed{color:var(--cyan); background:color-mix(in srgb,var(--cyan) 16%,transparent); border:1px solid color-mix(in srgb,var(--cyan) 30%,transparent);}
  .st.done{color:var(--green); background:rgba(48,209,88,.14); border:1px solid rgba(48,209,88,.3);}
  .st.cancelled{color:var(--red); background:rgba(255,69,58,.14); border:1px solid rgba(255,69,58,.3);}

  .empty{text-align:center; color:var(--muted); padding:32px 14px; font-size:.9rem;}
  .empty .e{font-size:2.2rem; display:block; margin-bottom:8px;}

  .rev-head{
    display:flex; gap:18px; align-items:center; margin-bottom:14px;
    padding:16px; border-radius:var(--radius); background:var(--glass); border:1px solid var(--glass-border);
  }
  .avg{font-family:var(--fh); font-size:3rem; font-weight:900; color:var(--amber); line-height:1;}
  .stars{color:var(--amber); display:inline-flex; gap:2px;}
  .stars span{display:inline-flex; gap:2px;}
  .stars .off{color:rgba(128,128,128,.32);}
  .stars svg{width:16px; height:16px; fill:currentColor;}
  .who{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px;}
  .who>div{display:flex; align-items:center; gap:10px;}
  .who small{color:var(--muted); font-size:.73rem;}
  .av{
    width:36px; height:36px; border-radius:12px; flex:none; display:grid; place-items:center;
    font:800 .85rem var(--fh); color:#111; background:linear-gradient(135deg,var(--cyan),var(--amber));
  }
  .star-pick{display:flex; gap:8px; cursor:pointer; user-select:none; padding:4px 0;}
  .star-pick span{color:rgba(128,128,128,.35); transition:transform .16s var(--spring), color .16s; display:inline-flex;}
  .star-pick span:active{transform:scale(1.25);}
  .star-pick span.on{color:var(--amber); filter:drop-shadow(0 0 8px color-mix(in srgb,var(--amber) 55%,transparent));}
  .star-pick svg{width:34px; height:34px; fill:currentColor; display:block;}

  .dist{margin:0 0 16px; display:grid; gap:6px; padding:14px 16px; border-radius:var(--radius); background:var(--glass); border:1px solid var(--glass-border);}
  .dist div{display:flex; align-items:center; gap:10px; font-size:.74rem; color:var(--muted);}
  .dist b{width:14px; color:var(--text);}
  .dist i{flex:1; height:7px; border-radius:6px; background:var(--line); overflow:hidden; display:block;}
  .dist i u{display:block; height:100%; background:linear-gradient(90deg,var(--cyan),var(--amber)); border-radius:6px; transition:width .6s;}
  .dist span{width:24px; text-align:right;}

  /* ---------------- Me & Settings ---------------- */
  .me-head{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .me-head-left{display:flex; align-items:center; gap:14px;}
  .me-head .avatar{width:62px; height:62px; border-radius:20px; font-size:1.5rem;}
  .hours{width:100%; font-size:.84rem; margin-top:8px; border-collapse:collapse;}
  .hours td{padding:8px 0; color:var(--muted); border-bottom:1px solid var(--line);}
  .hours tr:last-child td{border:0;}
  .hours td:last-child{text-align:right; color:var(--text); font-weight:600;}

  .theme-row{display:flex; gap:8px; flex-wrap:wrap;}
  .theme-row button{
    flex:1; min-width:85px; padding:11px 12px;
    background:var(--glass); border:1.5px solid var(--glass-border);
    color:var(--text); border-radius:14px; font:700 .8rem var(--fb); cursor:pointer;
    transition:.18s var(--spring);
  }
  .theme-row button.active{
    border-color:var(--cyan);
    background:color-mix(in srgb,var(--cyan) 15%,transparent);
    color:var(--cyan);
  }

  footer{text-align:center; color:var(--muted); font-size:.76rem; padding:22px 16px 8px;}
  footer a{display:inline-block; color:inherit; font-weight:600; text-decoration:none; padding:10px 14px; letter-spacing:.3px;}
  footer a:active{opacity:.6;}

  /* ---------------- Floating Glass Dock ---------------- */
  .bottom-nav{
    position:fixed; z-index:80;
    left:12px; right:12px; bottom:calc(10px + env(safe-area-inset-bottom));
    max-width:560px; margin:0 auto;
    display:flex; justify-content:space-around; gap:4px;
    padding:6px; border-radius:26px;
    background:var(--nav-bg);
    backdrop-filter:blur(28px) saturate(200%);
    -webkit-backdrop-filter:blur(28px) saturate(200%);
    border:1px solid var(--glass-border);
    box-shadow:0 14px 36px rgba(0,0,0,.38), inset 0 1px 0 var(--glass-hi);
  }
  .bottom-nav button{
    flex:1; min-height:50px; border:0; border-radius:20px;
    background:transparent; color:var(--muted);
    font:600 .66rem var(--fb);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    cursor:pointer; transition:all .22s var(--spring); position:relative;
  }
  .bottom-nav button svg{width:22px; height:22px; display:block; transition:transform .22s var(--spring);}
  .bottom-nav button.active{
    color:var(--cyan); font-weight:800;
    background:color-mix(in srgb,var(--cyan) 14%,transparent);
  }
  .bottom-nav button.active svg{
    transform:translateY(-2px) scale(1.06);
    filter:drop-shadow(0 2px 8px color-mix(in srgb,var(--cyan) 50%,transparent));
    stroke-width:2.3;
  }
  .bottom-nav button.book-btn{color:var(--amber);}
  .bottom-nav button.book-btn.active{
    background:color-mix(in srgb,var(--amber) 16%,transparent);
    color:var(--amber);
  }

  #fab{
    position:fixed; right:16px; bottom:calc(86px + env(safe-area-inset-bottom)); z-index:70;
    width:52px; height:52px; border-radius:18px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#25d366,#128c7e); color:#fff;
    box-shadow:0 10px 26px rgba(37,211,102,.38), inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .2s var(--spring);
  }
  #fab:active{transform:scale(.9);}
  #fab svg{width:25px; height:25px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}

  #boot{text-align:center; padding:80px 20px; color:var(--muted);}
  #boot .spin{width:36px; height:36px; margin:0 auto 14px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--cyan); animation:spin .8s linear infinite;}

  /* ---------------- Dynamic Island Toast ---------------- */
  #toast{
    position:fixed; left:50%; top:calc(12px + env(safe-area-inset-top));
    transform:translate(-50%,-150%) scale(.9); z-index:300;
    max-width:92%; padding:11px 20px; border-radius:999px;
    font:700 .82rem var(--fb);
    background:rgba(18,22,32,.92); color:#fff;
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 14px 34px rgba(0,0,0,.45);
    transition:transform .32s var(--spring);
  }
  #toast.show{transform:translate(-50%,0) scale(1);}
  #toast.err{border-color:var(--red); color:#ff8078;}

  /* ==========================================================
     APPEARANCE STUDIO BOTTOM SHEET & ACTION MODAL
     ========================================================== */
  .sheet-backdrop{
    position:fixed; inset:0; z-index:210;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    opacity:0; pointer-events:none; transition:opacity .28s var(--spring);
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet-backdrop.open{opacity:1; pointer-events:auto;}
  .ios-sheet{
    width:100%; max-width:580px; max-height:86vh;
    background:var(--glass-solid);
    backdrop-filter:blur(34px) saturate(200%); -webkit-backdrop-filter:blur(34px) saturate(200%);
    border:1px solid var(--glass-border);
    border-radius:30px 30px 0 0;
    padding:12px 18px calc(26px + env(safe-area-inset-bottom));
    overflow-y:auto;
    transform:translateY(102%); transition:transform .36s var(--spring);
    box-shadow:0 -18px 50px rgba(0,0,0,.45);
  }
  .sheet-backdrop.open .ios-sheet{transform:translateY(0);}
  .sheet-grab{width:42px; height:5px; border-radius:99px; background:var(--muted); opacity:.4; margin:2px auto 12px;}
  .sheet-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .sheet-top h3{font-size:1.1rem; font-weight:800;}

  .preset-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px;}
  @media (max-width:420px){.preset-grid{grid-template-columns:repeat(2,1fr);}}
  .preset-btn{
    padding:10px 8px; border-radius:16px; border:1.5px solid var(--line);
    background:var(--glass); color:var(--text); cursor:pointer;
    display:flex; align-items:center; gap:8px; font:700 .75rem var(--fb);
    transition:.18s var(--spring);
  }
  .preset-btn:active{transform:scale(.95);}
  .preset-btn.on{border-color:var(--cyan); background:color-mix(in srgb,var(--cyan) 15%,transparent);}
  .preset-dot{width:24px; height:24px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:.8rem; border:1px solid rgba(255,255,255,.2);}

  .swatch-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:8px 0 12px;}
  .swatch{
    width:32px; height:32px; border-radius:50%; border:2px solid transparent;
    cursor:pointer; transition:transform .16s;
  }
  .swatch:active{transform:scale(.88);}
  .swatch.on{border-color:#fff; box-shadow:0 0 0 2px var(--cyan); transform:scale(1.08);}

  .studio-group{
    background:color-mix(in srgb,var(--bg) 42%,var(--glass));
    border:1px solid var(--line); border-radius:18px;
    padding:4px 14px; margin-bottom:12px;
  }
  .studio-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:11px 0; border-bottom:1px solid var(--line); font-size:.85rem;
  }
  .studio-row:last-child{border:0;}
  .studio-row b{font-weight:600;}
  .studio-row small{display:block; color:var(--muted); font-size:.72rem;}
  .studio-slider{width:130px; accent-color:var(--cyan); min-height:auto; padding:0; border:0;}

  /* Switch */
  .ios-sw{position:relative; width:50px; height:30px; flex:none; display:inline-block;}
  .ios-sw input{opacity:0; width:0; height:0;}
  .ios-sw i{
    position:absolute; inset:0; border-radius:99px;
    background:rgba(120,120,128,.36); cursor:pointer; transition:.22s;
  }
  .ios-sw i::after{
    content:""; position:absolute; top:3px; left:3px;
    width:24px; height:24px; border-radius:50%; background:#fff;
    box-shadow:0 2px 6px rgba(0,0,0,.3); transition:.22s var(--spring);
  }
  .ios-sw input:checked + i{background:var(--green);}
  .ios-sw input:checked + i::after{transform:translateX(20px);}

  /* Modal Dialog (replaces confirm) */
  .modal-backdrop{
    position:fixed; inset:0; z-index:260; background:rgba(0,0,0,.55);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    display:grid; place-items:center; padding:20px;
    opacity:0; pointer-events:none; transition:opacity .22s;
  }
  .modal-backdrop.open{opacity:1; pointer-events:auto;}
  .ios-Dialog{
    width:100%; max-width:320px; border-radius:22px;
    background:var(--glass-solid); border:1px solid var(--glass-border);
    backdrop-filter:blur(30px); text-align:center; overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
    transform:scale(.92); transition:transform .24s var(--spring);
  }
  .modal-backdrop.open .ios-Dialog{transform:scale(1);}
  .ios-Dialog-body{padding:20px 18px 16px;}
  .ios-Dialog-body h4{font-size:1.02rem; font-weight:700; margin-bottom:6px;}
  .ios-Dialog-body p{font-size:.82rem; color:var(--muted);}
  .ios-Dialog-acts{display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--line);}
  .ios-Dialog-acts button{
    padding:13px; border:0; background:transparent; color:var(--cyan);
    font:600 .9rem var(--fb); cursor:pointer;
  }
  .ios-Dialog-acts button + button{border-left:1px solid var(--line);}
  .ios-Dialog-acts button.danger{color:var(--red); font-weight:700;}

  :focus-visible{outline:2px solid var(--cyan); outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important; scroll-behavior:auto!important;}}

/* ---- UX polish ---- */
:focus-visible{outline:2px solid var(--cyan,#0a84ff);outline-offset:2px}
.quick-item,.mini,.svc-pick-card,.cal-day,.qtag,.elec-pill{cursor:pointer;-webkit-tap-highlight-color:transparent}
.chips button:disabled{opacity:.38;text-decoration:line-through;cursor:not-allowed}
.btn:disabled{opacity:.6;cursor:wait}
.btn,.chips button{min-height:44px}
input,select,textarea{font-size:max(16px,1rem)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
.quick-ico svg{width:22px;height:22px}
</style>
</head>
<body>

<header>
  <div class="brand" id="brand" data-view="home"></div>
  <div class="head-actions">
    <button class="menu-toggle" id="menuToggle" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</header>
<div id="ann"></div>
<div class="drawer-overlay" id="overlay"></div>
<nav class="nav-drawer" id="drawer"></nav>

<!-- Appearance Studio Bottom Sheet -->
<div class="sheet-backdrop" id="studioSheet" aria-hidden="true">
  <div class="ios-sheet" id="studioBody"></div>
</div>

<!-- Confirmation Modal (Canvas-safe replacement for confirm()) -->
<div class="modal-backdrop" id="confirmModal" aria-hidden="true">
  <div class="ios-Dialog">
    <div class="ios-Dialog-body">
      <h4 id="cmTitle">Confirm Action</h4>
      <p id="cmText">Are you sure?</p>
    </div>
    <div class="ios-Dialog-acts">
      <button type="button" id="cmNo">Cancel</button>
      <button type="button" class="danger" id="cmYes">Confirm</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<main id="app"><div id="boot"><div class="spin"></div>Loading KMK Electrical Works…</div></main>
<a id="fab" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.7-5.4A8.4 8.4 0 1 1 21 11.5z"/><path d="M9 9.2c.2 2.6 2.4 4.9 5.3 5.6l1.2-1.3-2-1-.9.6c-.8-.4-1.5-1.1-1.9-1.9l.6-.9-1-2z"/></svg></a>
<nav class="bottom-nav" id="bottomNav" aria-label="Main navigation"></nav>

<script>
const $ = s => document.querySelector(s);
const EMO_RE = /[\u{1F000}-\u{1FAFF}\u2600-\u2604\u2607-\u2712\u2716-\u27BF\u2B50\u2B55\u2B1B\u2B1C\u231A\u231B\u23E9-\u23FF\u200D\uFE0F\u20E3]/gu;
const escE = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const esc = s => String(s ?? "").replace(EMO_RE, "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICONS = {
  home: I('<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/>'),
  services: I('<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>'),
  electricians: I('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M17 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18.5 14.3c1.8.7 3 2.5 3 5.2"/>'),
  book: I('<path d="M13 2 4 14h6l-1 8 9-12h-6z"/>'),
  reviews: I('<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'),
  me: I('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>')
};
const TAB_EMOJIS = { home: "", services: "", electricians: "", book: "", reviews: "", me: "" };
const BOLT = '<svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>';
const STATUS = {pending:"PENDING", confirmed:"CONFIRMED", done:"COMPLETED", cancelled:"CANCELLED"};

let S = VX.clone(VX.DEFAULTS), R = [], view = null, mine = [], bookPrefill = {}, ticketHTML = "";
let bookUrgency = "Standard Visit";

/* ---------- Smart Emoji & User Theme Helpers ---------- */
/* UI customization is admin-only: visitors always get the theme set in the admin panel */
const userTheme = () => null;
const userCustom = () => ({});
const effTheme = () => Object.assign({}, S.theme, userCustom());
const emOn = () => effTheme().showEmojis !== false;
const em = (e, fallback="") => emOn() ? e : fallback;

const LEGACY_SVC_EMOJI = {
  "EI": "", "RM": "", "HW": "", "LS": "", "AE": ""
};
function svcIcon(s) { const e = String(s.e || "").trim(); return e ? escE(e) : esc(((s.t || "?").trim()[0] || "?").toUpperCase()); }
function infoIcon(r) { return "•"; }

const tabs = () => S.tabs.filter(t => t.show !== false && !(t.id === "electricians" && !S.electricians.some(e => e.show !== false)));
const split = s => String(s || "").split(",").map(x => x.trim()).filter(Boolean);

let _tt;
function toast(m, bad){
  const t = $("#toast");
  t.textContent = m;
  t.className = "show" + (bad ? " err" : "");
  clearTimeout(_tt);
  _tt = setTimeout(() => t.className = "", 2600);
}

/* Modal Confirm helper */
let _cmCb = null;
function iosConfirm(title, text, onYes) {
  $("#cmTitle").textContent = title;
  $("#cmText").textContent = text;
  _cmCb = onYes;
  $("#confirmModal").classList.add("open");
}
$("#cmNo").onclick = () => { $("#confirmModal").classList.remove("open"); _cmCb = null; };
$("#cmYes").onclick = () => { $("#confirmModal").classList.remove("open"); if (_cmCb) _cmCb(); _cmCb = null; };

/* Clipboard helper with fallback */
function copyText(txt) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(() => toast("Booking ID copied!")).catch(() => fallbackCopy(txt));
  } else {
    fallbackCopy(txt);
  }
}
function fallbackCopy(txt) {
  try {
    const ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
    toast("Booking ID copied!");
  } catch (e) { toast("Copy failed", 1); }
}

window.addEventListener("scroll", () => document.querySelector("header").classList.toggle("scrolled", scrollY > 8), {passive:true});
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';
const ARR = '<svg class="ar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
const starsHTML = n => `<span>${STAR.repeat(n)}</span><span class="off">${STAR.repeat(5-n)}</span>`;
const distHTML = rv => rv.length ? `<div class="dist">${[5,4,3,2,1].map(n => { const c = rv.filter(r => r.r === n).length; return `<div><b>${n}★</b><i><u style="width:${Math.round(c/rv.length*100)}%"></u></i><span>${c}</span></div>`; }).join("")}</div>` : "";

function ago(t){
  const m = Math.floor((Date.now() - t) / 60000);
  if(m < 1) return "Just now"; if(m < 60) return m + " min ago";
  const h = Math.floor(m/60); if(h < 24) return h + " hr ago";
  const d = Math.floor(h/24); return d < 30 ? d + " days ago" : new Date(t).toLocaleDateString();
}
const allReviews = () => [
  ...R.filter(r => r.approved).map(r => ({n:r.n, r:r.r, t:r.t, d:ago(r.at)})),
  ...S.reviews.seed.filter(r => r.show !== false)
];
const fill = s => String(s).replace("{address}", S.contact.address).replace("{phone}", S.contact.phoneShow + (S.contact.phoneShow2 ? " / " + S.contact.phoneShow2 : ""));
const typing = () => { const a = document.activeElement; return a && $("#app").contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName); };

/* ---------- Shell & Theme ---------- */
function buildShell(){
  const b = S.brand;
  const logo = b.logoUrl ? `<img src="${esc(b.logoUrl)}" alt="">` : `<span class="lg">${(esc(b.logo) || BOLT)}</span>`;
  $("#brand").innerHTML = `${logo}<div class="brand-text"><div class="brand-title">${esc(b.text1)}<span>${esc(b.text2)}</span></div><div class="brand-sub">${esc(b.tagline)}</div></div>`;
  document.title = `${b.text1}${b.text2} — ${b.tagline}`;
  let fav = document.querySelector("link[rel=icon]"); if(!fav){ fav = document.createElement("link"); fav.rel = "icon"; document.head.appendChild(fav); }
  if(b.logoUrl) fav.href = b.logoUrl;
  const ann = $("#ann");
  if(S.announce.on && S.announce.text){
    ann.style.display = "block"; ann.textContent = S.announce.text;
    ann.style.background = VX.rgba(S.announce.color, .15); ann.style.color = S.announce.color;
  } else ann.style.display = "none";
  const T = tabs();
  $("#bottomNav").innerHTML = T.map(t => `<button data-view="${t.id}" class="${t.id==='book'?'book-btn':''}">${ICONS[t.id]}<span>${em(TAB_EMOJIS[t.id] + " ", "")}${esc(t.label)}</span></button>`).join("");
  $("#drawer").innerHTML = `
    <div class="drawer-head"><b>${em("","")}Navigation</b><button class="ios-icon-btn" type="button" data-close-drawer="1" style="height:30px;min-width:30px;padding:0 8px">✕</button></div>
    ${T.map(t => `<button data-view="${t.id}"><span>${em(TAB_EMOJIS[t.id] + "  ", "")}${esc(t.label)}</span><span>›</span></button>`).join("")}`;
  $("#fab").href = `https://wa.me/${S.contact.phone}?text=${encodeURIComponent(S.contact.waMessage)}`;
  VX.applyTheme(S.theme, userTheme(), userCustom());
  document.querySelector('meta[name=theme-color]').content = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || "#07090e";
  markActive();
}
function markActive(){ document.querySelectorAll("[data-view]").forEach(b => b.classList.toggle("active", b.dataset.view === view)); }
function toggleDrawer(o){ $("#drawer").classList.toggle("open", o); $("#overlay").classList.toggle("open", o); }
$("#menuToggle").onclick = () => toggleDrawer(!$("#drawer").classList.contains("open"));
$("#overlay").onclick = () => toggleDrawer(false);

/* ---------- Appearance Studio Sheet ---------- */
const SWATCHES = ["#0a84ff", "#00d9ff", "#30d158", "#ffb84d", "#ff375f", "#bf5af2", "#ffd60a", "#ff9f0a"];
function renderStudio() {
  const _sc = $("#studioBody").scrollTop;
  renderStudioInner();
  $("#studioBody").scrollTop = _sc;
}
function renderStudioInner() {
  const ut = userTheme(), uc = userCustom(), eff = effTheme();
  const activePreset = ut || eff.preset || "dark";
  $("#studioBody").innerHTML = `
    <div class="sheet-grab"></div>
    <div class="sheet-top">
      <div>
        <h3>Appearance Studio</h3>
        <small style="color:var(--muted);font-size:.75rem">Customize colors, liquid glass blur, shape & fonts live</small>
      </div>
      <button type="button" class="ios-icon-btn" data-close-studio="1">Done ✓</button>
    </div>

    <label>THEME PRESETS</label>
    <div class="preset-grid">
      ${Object.entries(VX.PRESETS).map(([k, p]) => `
        <button type="button" class="preset-btn ${activePreset === k ? "on" : ""}" data-st-preset="${k}">
          <span class="preset-dot" style="background:linear-gradient(135deg,${p.bg} 45%,${p.a} 45% 75%,${p.b} 75%)">${p.icon || ""}</span>
          <span>${esc(p.name)}</span>
        </button>`).join("")}
    </div>

    <label>ACCENT COLOR & CUSTOM PALETTE</label>
    <div class="studio-group">
      <div class="studio-row">
        <div><b>Use Custom Accent Colors</b><small>Override preset primary & secondary colors</small></div>
        <label class="ios-sw"><input type="checkbox" data-st-toggle="custom" ${eff.custom ? "checked" : ""}><i></i></label>
      </div>
      <div style="padding:10px 0">
        <small style="color:var(--muted);font-size:.72rem;display:block;margin-bottom:6px">Quick Neon Swatches (Primary Accent)</small>
        <div class="swatch-row">
          ${SWATCHES.map(c => `<button type="button" class="swatch ${eff.accent === c && eff.custom ? "on" : ""}" style="background:${c}" data-st-swatch="${c}" aria-label="Color ${c}"></button>`).join("")}
        </div>
        <div style="display:flex;gap:12px;margin-top:8px">
          <div style="flex:1;display:flex;align-items:center;gap:8px">
            <input type="color" value="${esc(eff.accent || "#0a84ff")}" data-st-color="accent" style="width:42px;height:38px;padding:2px;border-radius:10px;cursor:pointer">
            <small style="color:var(--muted);font-size:.74rem">Primary</small>
          </div>
          <div style="flex:1;display:flex;align-items:center;gap:8px">
            <input type="color" value="${esc(eff.accent2 || "#ffb84d")}" data-st-color="accent2" style="width:42px;height:38px;padding:2px;border-radius:10px;cursor:pointer">
            <small style="color:var(--muted);font-size:.74rem">Highlight</small>
          </div>
        </div>
      </div>
    </div>

    <label>LIQUID GLASS & SHAPE</label>
    <div class="studio-group">
      <div class="studio-row">
        <div><b>Frosted Blur Intensity</b><small id="lbl-blur">${eff.blur ?? 24}px backdrop blur</small></div>
        <input type="range" class="studio-slider" min="0" max="36" value="${eff.blur ?? 24}" data-st-range="blur" data-unit="px">
      </div>
      <div class="studio-row">
        <div><b>Card Corner Squircle</b><small id="lbl-radius">${eff.radius ?? 20}px roundness</small></div>
        <input type="range" class="studio-slider" min="8" max="30" value="${eff.radius ?? 20}" data-st-range="radius" data-unit="px">
      </div>
      <div class="studio-row">
        <div><b>Glass Surface Opacity</b><small id="lbl-glass">${eff.glass ?? 6}% translucency</small></div>
        <input type="range" class="studio-slider" min="2" max="18" value="${eff.glass ?? 6}" data-st-range="glass" data-unit="%">
      </div>
    </div>

    <label>TYPOGRAPHY & EXPERIENCE</label>
    <div class="studio-group">
      <div class="studio-row">
        <div><b>App Font Style</b><small>Heading & UI typeface</small></div>
        <select data-st-select="fontHead" style="width:145px;min-height:38px;padding:6px 10px;font-size:.8rem">
          ${Object.keys(VX.FONTS).map(f => `<option value="${esc(f)}" ${eff.fontHead === f ? "selected" : ""}>${esc(f)}</option>`).join("")}
        </select>
      </div>
      <div class="studio-row">
        <div><b>Text Size Scale</b><small id="lbl-fontScale">${eff.fontScale ?? 100}%</small></div>
        <input type="range" class="studio-slider" min="88" max="120" value="${eff.fontScale ?? 100}" data-st-range="fontScale" data-unit="%">
      </div>
      <div class="studio-row">
        <div><b>Ambient Neon Glow</b><small>Soft background radial light</small></div>
        <label class="ios-sw"><input type="checkbox" data-st-toggle="glowOn" ${eff.glowOn !== false ? "checked" : ""}><i></i></label>
      </div>
      <div class="studio-row">
        <div><b>Smooth Spring Motion</b><small>Transitions & micro-animations</small></div>
        <label class="ios-sw"><input type="checkbox" data-st-toggle="animations" ${eff.animations !== false ? "checked" : ""}><i></i></label>
      </div>
    </div>

    <div class="btn-row" style="margin-top:14px">
      <button type="button" class="btn btn-ghost btn-sm" data-st-reset="1">Reset to Default</button>
      <button type="button" class="btn btn-cyan btn-sm" data-close-studio="1">Save & Apply</button>
    </div>`;
}
function openStudio(open) {
  const sh = $("#studioSheet");
  if (open) renderStudio();
  sh.classList.toggle("open", open); sh.setAttribute("aria-hidden", String(!open));
}
$("#studioSheet").addEventListener("click", e => {
  if (e.target === $("#studioSheet") || e.target.closest("[data-close-studio]")) { openStudio(false); return; }
  const pr = e.target.closest("[data-st-preset]");
  if (pr) {
    const k = pr.dataset.stPreset;
    VX.LS.set("vx_user_theme", k);
    const uc = userCustom(); uc.preset = k; VX.LS.set("vx_user_custom", uc);
    buildShell(); render(); renderStudio();
    toast("Theme: " + (VX.PRESETS[k]?.name || k));
    return;
  }
  const sw = e.target.closest("[data-st-swatch]");
  if (sw) {
    const c = sw.dataset.stSwatch;
    const uc = userCustom(); uc.custom = true; uc.accent = c; VX.LS.set("vx_user_custom", uc);
    buildShell(); renderStudio();
    return;
  }
  const rs = e.target.closest("[data-st-reset]");
  if (rs) {
    VX.LS.set("vx_user_theme", null);
    VX.LS.set("vx_user_custom", {});
    buildShell(); render(); renderStudio();
    toast("Reset to workshop default");
  }
});
$("#studioSheet").addEventListener("input", e => {
  const t = e.target, uc = userCustom();
  if (t.dataset.stRange) {
    const k = t.dataset.stRange, v = Number(t.value);
    uc[k] = v; VX.LS.set("vx_user_custom", uc);
    const lbl = $("#lbl-" + k); if (lbl) lbl.textContent = v + (t.dataset.unit || "");
    VX.applyTheme(S.theme, userTheme(), uc);
  } else if (t.dataset.stColor) {
    const k = t.dataset.stColor;
    uc.custom = true; uc[k] = t.value; VX.LS.set("vx_user_custom", uc);
    VX.applyTheme(S.theme, userTheme(), uc);
  } else if (t.dataset.stSelect) {
    const k = t.dataset.stSelect;
    uc[k] = t.value;
    if (k === "fontHead") uc.fontBody = t.value === "Orbitron" || t.value === "Teko" ? "Inter" : t.value;
    VX.LS.set("vx_user_custom", uc);
    VX.applyTheme(S.theme, userTheme(), uc);
  } else if (t.dataset.stToggle) {
    const k = t.dataset.stToggle;
    uc[k] = t.checked; VX.LS.set("vx_user_custom", uc);
    buildShell(); render(); renderStudio();
  }
});

function go(id){
  const T = tabs(); if(!T.length) return;
  if(!T.some(t => t.id === id)) id = T[0].id;
  if(id !== "book" && id !== view) ticketHTML = "";
  view = id; toggleDrawer(false); markActive(); $("#fab").style.display = id === "book" ? "none" : "flex";
  try{ history.replaceState(null, "", "#" + id); }catch(e){}
  if(id === "me") loadMine();
  render(); window.scrollTo(0,0);
}

document.addEventListener("click", e => {
  if(navigator.vibrate && e.target.closest("button,a,.mini,.svc-pick-card,.cal-day")) navigator.vibrate(8);
  if(e.target.closest("[data-open-studio]")){ toggleDrawer(false); openStudio(true); return; }
  if(e.target.closest("[data-close-drawer]")){ toggleDrawer(false); return; }
  const cp = e.target.closest("[data-copy]"); if(cp){ copyText(cp.dataset.copy); return; }
  const v = e.target.closest("[data-view]"); if(v){ go(v.dataset.view); return; }
  const th = e.target.closest("[data-usertheme]"); if(th){ const m = th.dataset.usertheme; VX.LS.set("vx_user_theme", m === "auto" ? null : m); buildShell(); render(); return; }
  const pk = e.target.closest("[data-book]"); if(pk){ bookPrefill = JSON.parse(pk.dataset.book); if(bookPrefill.urg) bookUrgency = bookPrefill.urg; go("book"); return; }
  const cx = e.target.closest("[data-cancel]"); if(cx){ cancelBooking(cx.dataset.cancel); return; }
});

/* ---------- VIEWS ---------- */
function vHome(){
  const H = S.home, rv = allReviews(), avg = rv.length ? (rv.reduce((a,r)=>a+r.r,0)/rv.length).toFixed(1) : "–";
  const sv = S.services.filter(s => s.show !== false), el = S.electricians.filter(e => e.show !== false);
  const hasTab = id => tabs().some(t => t.id === id);
  const stat = x => String(x).replace("{rating}", avg).replace("{count}", rv.length);
  return `

function waLink(b){
  const msg = `*Booking ${b.id}*\nName: ${b.name}\nPhone: ${b.phone}\nService: ${b.service}\nPriority: ${b.urg || "Standard Visit"}\nElectrician: ${b.elec}\nDate: ${b.date} at ${b.time}\nAddress: ${b.addr || "-"}` + (b.note ? `\nProblem: ${b.note}` : "");
  return `https://wa.me/${S.contact.phone}?text=${encodeURIComponent(msg)}`;
}
async function loadMine(){
  const ids = VX.LS.get("vx_mine", []);
  const list = await Promise.all(ids.map(async id => {
    try{ return (await VX.getBooking(id)) || null; }catch(e){ return null; }
  }));
  const cache = VX.LS.get("vx_mine_cache", {});
  mine = ids.map((id, i) => list[i] || cache[id]).filter(Boolean).reverse();
  if(view === "me" && !typing()) render();
}
function cancelBooking(id){
  iosConfirm("Cancel Booking?", "Are you sure you want to cancel this booking?", async () => {
    try{
      await VX.updateBooking(id, {status:"cancelled"});
      const cache = VX.LS.get("vx_mine_cache", {});
      if (cache[id]) { cache[id].status = "cancelled"; VX.LS.set("vx_mine_cache", cache); }
      toast("Booking cancelled");
    }catch(e){ toast("Cancel failed - please call us.", 1); return; }
    loadMine();
  });
}

function bindBook(){
  const f = $("#bookForm"); if(!f) return;
  bookPrefill = {};
  const dIn = $("#bDate"), tIn = $("#bTime"), sIn = $("#bService"), eIn = $("#bElec");
  const pad = n => String(n).padStart(2,"0");
  const ymd = o => { const d = new Date(); d.setDate(d.getDate() + o); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); };
  const mins = t => { const m = /(\d+):(\d+)\s*(AM|PM)/i.exec(t); if(!m) return null; let h = +m[1] % 12; if(/PM/i.test(m[3])) h += 12; return h*60 + +m[2]; };
  const tb = () => [...document.querySelectorAll("#timeChips button")];

  const updateSummary = () => {
    const sm = $("#sumMain"), ss = $("#sumSub"), su = $("#sumUrg"), s3 = $("#step3Ind");
    if (sm) sm.textContent = sIn.value || "Service";
    if (ss) ss.textContent = `${dIn.value} · ${tIn.value || "No slot"} · ${eIn.value}`;
    if (su) su.textContent = bookUrgency;
    const hasContact = ($("#bName")?.value.trim().length >= 2) && ($("#bPhone")?.value.trim().length >= 9);
    if (s3) s3.classList.toggle("active", !!hasContact);
  };

  const refresh = () => {
    const now = new Date(), nm = now.getHours()*60 + now.getMinutes(), isToday = dIn.value === ymd(0);
    tb().forEach(b => { const m = mins(b.dataset.time); b.disabled = isToday && m !== null && m <= nm; });
    const cur = tb().find(b => b.classList.contains("on"));
    if(!cur || cur.disabled){
      const nx = tb().find(b => !b.disabled);
      tb().forEach(b => b.classList.toggle("on", b === nx));
      tIn.value = nx ? nx.dataset.time : "";
    }
    const availCnt = tb().filter(b => !b.disabled).length;
    const stEl = $("#slotStatus");
    if (stEl) stEl.textContent = availCnt ? `${availCnt} slots available` : "No slots left today — pick tomorrow";
    document.querySelectorAll("#dayChips button").forEach(b => b.classList.toggle("on", ymd(+b.dataset.day) === dIn.value));
    updateSummary();
  };

  f.addEventListener("click", e => {
    const urg = e.target.closest("[data-urg]");
    if (urg) {
      bookUrgency = urg.dataset.urg;
      document.querySelectorAll("#urgSeg button").forEach(b => b.classList.toggle("on", b === urg));
      updateSummary(); return;
    }
    const ps = e.target.closest("[data-pick-svc]");
    if (ps) {
      sIn.value = ps.dataset.pickSvc;
      document.querySelectorAll("#svcPickGrid .svc-pick-card").forEach(b => b.classList.toggle("on", b === ps));
      updateSummary(); return;
    }
    const pe = e.target.closest("[data-pick-elec]");
    if (pe) {
      eIn.value = pe.dataset.pickElec;
      document.querySelectorAll("#elecPickRow .elec-pill").forEach(b => b.classList.toggle("on", b === pe));
      updateSummary(); return;
    }
    const d = e.target.closest("[data-day]");
    if (d) { dIn.value = ymd(+d.dataset.day); refresh(); return; }
    const t = e.target.closest("[data-time]");
    if (t && !t.disabled) { tIn.value = t.dataset.time; tb().forEach(b => b.classList.toggle("on", b === t)); updateSummary(); return; }
    const ar = e.target.closest("[data-area]");
    if (ar) {
      const aIn = $("#bAddr");
      if (aIn) {
        const cur = aIn.value.trim();
        if (!cur.toLowerCase().includes(ar.dataset.area.toLowerCase())) {
          aIn.value = cur ? `${cur}, ${ar.dataset.area}` : ar.dataset.area;
        }
        aIn.classList.remove("invalid");
      }
      return;
    }
    const is = e.target.closest("[data-issue]");
    if (is) {
      const nIn = $("#bNote");
      if (nIn) {
        const tag = is.dataset.issue;
        const on = is.classList.toggle("on");
        const parts = nIn.value.split(" · ").map(x => x.trim()).filter(Boolean), ix = parts.indexOf(tag);
        if (on && ix < 0) parts.push(tag);
        if (!on && ix >= 0) parts.splice(ix, 1);
        nIn.value = parts.join(" · ");
      }
      return;
    }
  });

  dIn.addEventListener("change", refresh);
  refresh();
  f.addEventListener("input", e => { e.target.classList.remove("invalid"); updateSummary(); });

  f.addEventListener("submit", async ev => {
    ev.preventDefault();
    const v = s => ($(s) ? $(s).value.trim() : ""), err = $("#bErr");
    const name = v("#bName"), phone = v("#bPhone").replace(/\s+/g,""), addr = v("#bAddr");
    err.textContent = "";
    const bad = (sel, m) => { err.textContent = "" + m; const el = $(sel); if(el){ el.classList.add("invalid"); el.focus(); } };
    if(name.length < 2) return bad("#bName", "Please enter your name.");
    if(!/^\+?\d{9,14}$/.test(phone)) return bad("#bPhone", "Please enter a valid mobile number.");
    if(S.booking.requireAddress && addr.length < 3) return bad("#bAddr", "Please enter your address / area (e.g. Kurunagala / Pottuvil).");
    if(!v("#bDate")) return bad("#bDate", "Please select a date.");
    if(v("#bDate") < $("#bDate").min || v("#bDate") > $("#bDate").max) return bad("#bDate", "Date must be between " + $("#bDate").min + " and " + $("#bDate").max + ".");
    if(!v("#bTime")) return err.textContent = "No time slots left for this day — please pick another date.";
    const b = {
      id:VX.uid("VX"), name, phone,
      service:v("#bService"), elec:v("#bElec"),
      date:v("#bDate"), time:v("#bTime"),
      addr, note:v("#bNote"), urg:bookUrgency,
      status:"pending", at:Date.now()
    };
    const btn = f.querySelector("button[type=submit]"); btn.disabled = true;
    try{ await VX.addBooking(b); }catch(e){ btn.disabled = false; return err.textContent = "Booking failed — please call us. (" + (e.code || e.message) + ")"; }
    btn.disabled = false;
    VX.LS.set("vx_profile", {name, phone, addr});
    const ids = VX.LS.get("vx_mine", []); ids.push(b.id); VX.LS.set("vx_mine", ids);
    const cache = VX.LS.get("vx_mine_cache", {}); cache[b.id] = b; VX.LS.set("vx_mine_cache", cache);
    ticketHTML = `
      <div class="ticket">
        <div class="ticket-head">
          <div>
            <small style="color:var(--green);font-weight:800;display:block">${esc(S.booking.successText)}</small>
            <div class="ordn">${esc(b.id)}</div>
          </div>
          <span class="st pending">PENDING</span>
        </div>
        <div class="ticket-grid">
          <div><small>Service</small><b>${esc(b.service)}</b></div>
          <div><small>Priority</small><b>${esc(b.urg)}</b></div>
          <div><small>Date & Time</small><b>${esc(b.date)} · ${esc(b.time)}</b></div>
          <div><small>Electrician</small><b>${esc(b.elec)}</b></div>
        </div>
        <div class="btn-row">
          ${S.booking.sendWhatsApp ? `<a class="btn btn-main btn-sm" target="_blank" rel="noopener" href="${waLink(b)}">SEND ON WHATSAPP</a>` : ""}
          <button class="btn btn-ghost btn-sm" type="button" data-copy="${esc(b.id)}">COPY ID</button>
          <button class="btn btn-ghost btn-sm" type="button" data-view="me">MY BOOKINGS</button>
        </div>
      </div>`;
    toast("Booking Confirmed: " + b.id);
    render();
    window.scrollTo({top:0, behavior:"smooth"});
  });
}

/* ---------- REVIEW LOGIC ---------- */
function bindReviews(){
  const f = $("#revForm"); if(!f) return;
  let rating = 5;
  const ps = [...document.querySelectorAll("#starPick span")];
  const paintStars = r => ps.forEach((p,j) => p.classList.toggle("on", j < r));
  paintStars(rating);
  ps.forEach((s,i) => s.onclick = () => { rating = i + 1; paintStars(rating); });
  f.addEventListener("submit", async ev => {
    ev.preventDefault();
    const n = $("#rName").value.trim(), t = $("#rText").value.trim(), err = $("#rErr"); err.textContent = "";
    if(n.length < 2) return err.textContent = "Please enter your name.";
    if(!rating) return err.textContent = "Please select a star rating.";
    if(t.length < 5) return err.textContent = "Please write a short review.";
    const rb = f.querySelector("button[type=submit]"); rb.disabled = true;
    try{ await VX.addReview({id:VX.uid("RV"), n, r:rating, t, at:Date.now(), approved:!!S.reviews.autoApprove}); $("#rText").value = ""; }
    catch(e){ rb.disabled = false; return err.textContent = "Review failed — try again. (" + (e.code || e.message) + ")"; }
    rb.disabled = false;
    toast(S.reviews.autoApprove ? "Review posted!" : "Sent for approval");
    if(!S.reviews.autoApprove){ f.innerHTML = `<div class="empty">Thanks! Your review will appear after approval.</div>`; }
  });
}

/* ---------- RENDER ---------- */
function render(){
  const map = {home:vHome, services:vServices, electricians:vTeam, book:vBook, reviews:vReviews, me:vMe};
  $("#app").innerHTML = (map[view] || vHome)() + `<footer><a href="https://rusthicrush.github.io/Rush2/" target="_blank" rel="noopener">Powered by Rush Environment</a></footer>`;
  $("#app").style.animation = "none"; void $("#app").offsetWidth; $("#app").style.animation = "";
  bindBook(); bindReviews();
  document.querySelectorAll("#app [data-book], #app [data-view]").forEach(el => {
    if (el.matches("button,a[href]")) return;
    el.tabIndex = 0; el.setAttribute("role", "button");
  });
}
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('[role=button][data-book],[role=button][data-view]')) { e.preventDefault(); e.target.click(); return; }
  if (e.key !== "Escape") return;
  if ($("#confirmModal").classList.contains("open")) $("#cmNo").click();
  else if ($("#studioSheet").classList.contains("open")) openStudio(false);
  else if ($("#drawer").classList.contains("open")) toggleDrawer(false);
});
$("#confirmModal").addEventListener("click", e => { if (e.target.id === "confirmModal") $("#cmNo").click(); });
window.addEventListener("hashchange", () => { const h = location.hash.replace("#", ""); if (h && h !== view && !first) go(h); });

/* ---------- INIT (settings + reviews live) ---------- */
let first = true;
VX.onSettings(s => {
  S = s; buildShell();
  if(first){
    first = false;
    const h = location.hash.replace("#", "");
    go(h || "home");
  } else if(!typing()){
    if(!tabs().some(t => t.id === view)) go("home"); else if(view !== "book") render();
  }
});
VX.onReviews(l => { R = l.filter(x => x.approved); if(!first && (view === "reviews" || view === "home") && !typing()) render(); });
</script>
